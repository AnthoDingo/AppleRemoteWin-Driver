[package]
name = "AppleRemoteDriver"
version = "0.1.0"
edition = "2021"
license = "MIT AND MS-PL"

[lib]
crate-type = ["cdylib"]

[dependencies]
wdk = "0.3.0"
wdk-sys = "0.3.0"
wdk-alloc = "0.3.0"
wdk-panic = "0.3.0"

[build-dependencies]
wdk-build = "0.3.0"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 25

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
